[alembic]
script_location = src/logidx/migrations
prepend_sys_path = src
# Override with: alembic -x ... or set LOGIDX_DATABASE_URL and use `logidx initdb`.
sqlalchemy.url = sqlite:///data/logidx.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
