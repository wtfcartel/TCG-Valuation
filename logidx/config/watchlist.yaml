# Employer careers and recruiter watchlist.
#
# A board is searched only when `enabled` is true and every value under `board` is filled in.
# Entries without identifiers still appear on the Search Coverage page as NOT SEARCHED
# ("identifier not configured"), so nothing is silently skipped.
#
# IDENTIFIERS BELOW ARE INTENTIONALLY BLANK. They were not verified when this file was written
# (the build environment had no access to the employers' career sites), and guessing them would
# produce false "searched" claims. To fill one in, open the employer's careers page and copy:
#
#   workday:          board: {host: acme.wd3.myworkdayjobs.com, tenant: acme, site: AcmeCareers}
#                     (from a URL like https://acme.wd3.myworkdayjobs.com/AcmeCareers/job/...;
#                      tenant is usually the first label of the host)
#                     optional: full_listing: true for small boards; search_terms: [...]
#   smartrecruiters:  board: {company: AcmeGroup}         (jobs.smartrecruiters.com/AcmeGroup/...)
#                     optional: country: au
#   greenhouse:       board: {token: acme}                (boards.greenhouse.io/acme)
#   lever:            board: {site: acme}                 (jobs.lever.co/acme)
#   pageup:           board: {institution_id: "513"}      (careers.pageuppeople.com/513/...)
#   bullhorn:         board: {cluster: "11", corp_token: "abc123"}
#                     (from the agency's job-board page source: public-rest11.bullhornstaffing.com/
#                      rest-services/abc123/...); optional job_url_template: "https://agency/jobs/{id}"
#   rss:              board: {url: https://example.org/jobs.rss}
#
# Run `logidx probe` after editing to test each configured board live.

boards:
  # ---------------------------------------------------------------- executive search / recruiters
  - {key: sigma_search, name: Sigma Search Supply Chain, ats: unknown, agency: true, target_group: executive_search,
     board: {}, notes: "Supply chain executive search. Recall Case A advertised via LinkedIn."}
  - {key: six_degrees, name: Six Degrees Executive, ats: bullhorn, agency: true, target_group: executive_search,
     board: {cluster: "", corp_token: ""},
     notes: "Recall Case B reference BH-31092 suggests Bullhorn. Corp token not yet confirmed."}
  - {key: davidson, name: Davidson, ats: unknown, agency: true, target_group: executive_search, board: {}}
  - {key: sharp_carter, name: Sharp & Carter, ats: unknown, agency: true, target_group: executive_search, board: {}}
