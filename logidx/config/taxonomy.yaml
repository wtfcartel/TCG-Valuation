# The nine disciplines audited independently every calendar day.
# title_terms give a category priority when the title names it directly (e.g. CEO vs EGM).
# core_queries run on every scheduled run; rotating_queries are spread across the day's runs
# (run slot N takes every Nth query) so each one runs at least once per day.
categories:
  strategy:
    label: Strategy and Strategic Planning
    families: [C_strategy]
    core_queries: [head of strategy, strategy director, chief strategy officer, general manager strategy]
    rotating_queries: [corporate strategy, strategic planning, group strategy, strategy lead,
                       strategic initiatives, corporate planning, strategy execution, enterprise strategy,
                       strategic projects]
  mna:
    label: M&A and Corporate Development
    families: [D_mergers_acquisitions]
    core_queries: [corporate development, mergers and acquisitions, post-merger integration]
    rotating_queries: [m&a director, integration director, head of corporate development, acquisitions,
                       divestments, business integration, transaction execution, portfolio optimisation]
  egm_group:
    label: Executive General Manager and Group Leadership
    families: [A_general_management, B_head_of_lead]
    title_terms: [executive general manager, egm, group general manager, national general manager, regional general manager, state general manager, business unit general manager, country manager, chief of staff]
    core_queries: [executive general manager, group general manager, national general manager,
                   general manager]
    rotating_queries: [egm, regional general manager, state general manager, business unit general manager,
                       country manager, chief of staff]
  transformation:
    label: Enterprise Transformation and Turnaround
    families: [E_transformation]
    core_queries: [transformation director, head of transformation, business transformation]
    rotating_queries: [turnaround, restructuring, operational excellence, business improvement lead,
                       transformation lead, performance improvement, enterprise transformation,
                       operational transformation, cost reduction]
  commercial:
    label: Commercial Strategy and Growth
    families: [F_commercial]
    core_queries: [commercial director, chief commercial officer, general manager commercial, head of commercial]
    rotating_queries: [commercial lead, head of business development, strategic partnerships director,
                       commercial excellence, revenue growth director, enterprise sales director,
                       growth lead, customer strategy]
  private_equity:
    label: Private Equity and Portfolio Value Creation
    families: [G_private_equity]
    title_terms: [operating partner]
    core_queries: [operating partner, portfolio operations, value creation]
    rotating_queries: [private equity backed ceo, portfolio company general manager, buy-and-build,
                       founder succession, family business general manager, ceo succession]
  supply_chain_logistics:
    label: Supply Chain, Logistics and Transport
    families: [H_supply_chain_logistics]
    core_queries: [head of logistics, head of supply chain, general manager supply chain,
                   general manager logistics]
    rotating_queries: [supply chain director, logistics director, head of distribution, general manager transport,
                       cold chain general manager, contract logistics general manager, warehousing general manager,
                       head of fleet, intermodal general manager, ports general manager, rail operations general manager,
                       procurement director, 3pl general manager]
  operations:
    label: National Operations and Service Delivery
    families: [I_operations, B_head_of_lead]
    core_queries: [head of operations, operations director, general manager operations, national operations manager]
    rotating_queries: [head of national operations, service delivery director, head of service delivery,
                       infrastructure services general manager, industrial services general manager,
                       field services general manager, multi-site operations, operations lead]
  ceo_coo_advisory_nfp:
    label: CEO, COO, Managing Director, Advisory and NFP Leadership
    families: [A_general_management, J_advisory_interim_nfp, K_recruiter_terms]
    title_terms: [ceo, chief executive officer, coo, chief operating officer, managing director, md, executive director, interim ceo, interim coo, fractional coo, ceo designate, managing partner, practice director, principal consultant, advisory partner]
    core_queries: [chief executive officer, chief operating officer, managing director]
    rotating_queries: [ceo, coo, interim coo, fractional coo, interim general manager, not-for-profit ceo,
                       charity ceo, social enterprise ceo, principal consultant operations, practice director,
                       advisory partner, executive director, confidential appointment]
