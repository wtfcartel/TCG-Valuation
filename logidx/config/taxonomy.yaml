# LogiDx executive search taxonomy.
#
# Keywords are DISCOVERY SIGNALS, not eligibility rules. A match makes a vacancy a candidate for
# assessment; seniority, scope, geography and AI evaluation decide whether it is worth pursuing.
#
# Matching is case-insensitive on whole words. Australian/US spellings are generated
# automatically for -ise/-ize, -isation/-ization and -our/-or (see logidx/taxonomy.py), so list
# the Australian form only. "&" and "and" are treated as equivalent.
version: 1

seniority:
  # Titles that by themselves indicate executive level.
  executive:
    - chief executive officer
    - ceo
    - chief operating officer
    - coo
    - chief commercial officer
    - cco
    - chief strategy officer
    - chief transformation officer
    - chief supply chain officer
    - chief of staff
    - managing director
    - executive director
    - executive general manager
    - egm
    - group general manager
    - national general manager
    - country manager
    - managing partner
    - operating partner
    - ceo designate
    - president
    - vice president
    - vp
    - svp
  # Senior titles: usually executive or one level below; scope still matters.
  senior:
    - general manager
    - gm
    - regional general manager
    - state general manager
    - business unit general manager
    - head of
    - national head of
    - director
    - commercial director
    - operations director
    - strategy director
    - transformation director
    - practice director
    - principal consultant
    - advisory partner
    - partner
    - interim coo
    - fractional coo
    - interim general manager
    - national manager
    - national operations manager
    - state manager
  # "Lead" titles are NOT executive by default. They need scope evidence (see scope_signals).
  lead:
    - lead
  # Prefixes combined with function-first titles in generated queries.
  prefixes: [national, regional, group, enterprise, anz, state, global, apac]
  # Junior or support titles that should not be treated as executive even when a family matches.
  exclude:
    - assistant
    - coordinator
    - administrator
    - analyst
    - intern
    - internship
    - graduate
    - trainee
    - apprentice
    - officer          # "Chief ... Officer" is handled by the executive list first
    - associate
    - receptionist
    - executive assistant
    - personal assistant
    - team leader
    - supervisor
    - driver
    - storeperson
    - forklift
    - picker
    - clerk

# Description phrases that show genuine executive scope. Used to promote "Lead" titles and to
# separate executive roles from senior-specialist roles.
scope_signals:
  - p&l
  - profit and loss
  - ebitda
  - reporting to the ceo
  - reporting to the managing director
  - reporting to the coo
  - reporting to the board
  - executive leadership team
  - senior leadership team
  - elt
  - board reporting
  - direct reports
  - national operations
  - multi-site
  - annual revenue
  - turnover of
  - budget of
  - full accountability
  - strategic direction
  - business unit
  - value creation
  - private equity

# Signals of roles the candidate has asked to avoid (transactional cold calling) or that are
# specialist-dominated. These lower the deterministic prescore; they never hide a vacancy.
negative_signals:
  cold_calling: [cold calling, cold-calling, door to door, door-to-door, outbound calls, call targets,
                 commission only, new business hunter, telesales]
  specialist_technical: [software engineering, full stack, devops, data scientist, machine learning engineer,
                         clinical governance lead, registered nurse, pharmacist, structural engineer,
                         electrical engineer, mechanical engineer, process engineer, financial accounting,
                         statutory reporting, audit partner, actuarial]

# Deterministic hard-knockout patterns. The AI layer also assesses knockouts; these are used to
# make sure obvious mandatory credentials are never missed. "essential_markers" near a match
# make it essential; otherwise it is recorded as possibly desirable.
knockouts:
  essential_markers: [must have, must hold, mandatory, essential, required, requirement, you will need,
                      eligible to obtain, ability to obtain, current]
  patterns:
    engineering_registration: [chartered professional engineer, cpeng, rpeq, registered professional engineer,
                               degree in engineering, engineering degree, bachelor of engineering]
    accounting_qualification: [cpa, chartered accountant, ca anz, cima, acca]
    clinical_registration: [ahpra, registered nurse, clinical registration, medical practitioner]
    security_clearance: [nv1, nv2, negative vetting, baseline clearance, security clearance, agsva]
    legal_practice: [practising certificate, admitted as a lawyer, admitted to practice]
    industry_licence: [master mariner, first class mine manager, mine manager certificate, casa licence,
                       aviation licence, heavy rail safeworking, dangerous goods safety adviser]
    citizenship: [australian citizen, australian citizenship]

